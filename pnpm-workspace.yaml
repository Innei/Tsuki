packages:
  - 'packages/*'
  - 'examples/*'
  - 'benchmarks'
# common devDepends on core only for test helpers; core depends on common at runtime
ignoreWorkspaceCycles: true
overrides:
  '@esbuild-kit/core-utils@3.3.2>esbuild': '0.28.2'
  'giget@1.2.5>tar': '7.5.23'
allowBuilds:
  esbuild: true
  simple-git-hooks: true

onlyBuiltDependencies:
  - 'esbuild'
  - 'simple-git-hooks'
