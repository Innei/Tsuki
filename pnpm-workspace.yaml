packages:
  - 'packages/*'
  - 'examples/*'
  - 'benchmarks'
# common devDepends on core only for test helpers; core depends on common at runtime
ignoreWorkspaceCycles: true
overrides:
  '@esbuild-kit/core-utils@3.3.2>esbuild': '0.25.12'
  'giget@1.2.5>tar': '7.5.21'
allowBuilds:
  '@swc/core': true
  esbuild: true
  simple-git-hooks: true
  unrs-resolver: true

onlyBuiltDependencies:
  - '@swc/core'
  - 'esbuild'
  - 'simple-git-hooks'
  - 'unrs-resolver'
